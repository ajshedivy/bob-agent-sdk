[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bob-agent-sdk"
version = "0.1.0"
description = "Python SDK for building custom agents on IBM Bob Shell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-client-protocol>=1.0",
    "filelock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bob_agent_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
